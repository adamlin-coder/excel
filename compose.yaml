services:
  csv-workspace:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "${CSV_BIND_IP:-0.0.0.0}:${CSV_PORT:-8000}:8000"
    environment:
      CSV_DATA_DIR: /data
      CSV_CONFIG_FILE: /run/secrets/csv_config
      CSV_SECURE_COOKIE: "${CSV_SECURE_COOKIE:-0}"
      CSV_MAX_UPLOAD_MB: "${CSV_MAX_UPLOAD_MB:-1024}"
    volumes:
      - csv-data:/data
    secrets:
      - csv_config
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
secrets:
  csv_config:
    file: ./.local/server.json
volumes:
  csv-data:
